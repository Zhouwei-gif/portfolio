<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JD 匹配报告 · AI 产品经理</title>
<style>
:root{--bg:#070b14;--card:#111a2c;--line:#1f2c46;--fg:#e8eef9;--dim:#8fa1bd;--acc:#4fd1c5}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#16233c 0,transparent 60%),var(--bg);color:var(--fg);font:15px/1.75 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 64px}
a{color:var(--acc);text-decoration:none}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#4fd1c5,#8b7cf6);display:grid;place-items:center;font-weight:800;color:#08111f}
h1{font-size:19px;margin:0}
.sub{color:var(--dim);font-size:12.5px}
.back{margin-left:auto;font-size:13px}
.hint{color:var(--dim);font-size:12.5px;margin:6px 0 16px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
article h1{font-size:18px;margin:6px 0 12px}
article h2{font-size:15.5px;margin:22px 0 10px;color:#dfe9fb}
article h3{font-size:14px;margin:18px 0 8px;color:#cfdcf3}
article p{margin:8px 0;color:#cfdcef}
article ul,article ol{margin:8px 0;padding-left:22px;color:#cfdcef}
article li{margin:4px 0}
article code{background:#0c1524;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px}
article hr{border:0;border-top:1px solid var(--line);margin:18px 0}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#0e1828;color:#a9bcd8;font-weight:600}
td{color:#cfdcef}
.err{color:#f87171}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">JD</div>
    <div>
      <h1>JD 匹配报告</h1>
      <div class="sub">8 份真实 JD · 规则抽取 · 加权匹配 · 差距与两周行动</div>
    </div>
    <a class="back" href="../">← 返回作品集</a>
  </header>
  <div class="hint">内容由 match.py 生成，未做删改。</div>
  <article id="md">加载中…</article>
</div>
<script>
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
}
function mdToHtml(md){
  const lines = md.replace(/\r/g,"").split("\n");
  const out = [];
  let i = 0;
  const flushList = (tag, items) => out.push("<"+tag+">"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+tag+">");
  while (i < lines.length) {
    let line = lines[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^\s*---+\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    let m = line.match(/^(#{1,4})\s+(.*)$/);
    if (m) { const n = Math.min(m[1].length, 3); out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(1).filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r)).map(cells);
      out.push("<table><thead><tr>"+head.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
        body.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      continue;
    }
    if (/^\s*[-*]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*[-*]\s+/,""));
      flushList("ul", items); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*\d+[.)]\s+/,""));
      flushList("ol", items); continue;
    }
    out.push("<p>"+inline(line)+"</p>"); i++;
  }
  return out.join("\n");
}
fetch("report.md").then(r => r.text()).then(t => {
  document.getElementById("md").innerHTML = mdToHtml(t);
}).catch(() => {
  document.getElementById("md").innerHTML = '<p class="err">报告加载失败：请确认 report.md 与 index.html 在同一目录。</p>';
});
</script>
</body>
</html>
